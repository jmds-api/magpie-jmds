name: ci

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    secrets:
      GHCR_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    outputs:
      fork: ${{ steps.token.outputs.available }}
    steps:
      - id: token
        env:
          TOKEN_AVAILABLE: ${{ secrets.GHCR_READ_TOKEN != '' }}
        run: |
          echo "available=$TOKEN_AVAILABLE" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_AVAILABLE" != true ]; then
            echo 'Skipping fork job: GHCR_READ_TOKEN is unavailable (for example on external pull requests).'
          fi

  fork:
    needs: availability
    if: needs.availability.outputs.fork == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Log in to GHCR (read-only token)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
      - name: Check module and run fork E2E
        env:
          SUB2API_IMAGE: ghcr.io/broven/sub2api:${{ vars.SUB2API_FORK_TAG }}
        run: |
          test -n '${{ vars.SUB2API_FORK_TAG }}' || { echo 'SUB2API_FORK_TAG must be configured'; exit 1; }
          node --check index.mjs
          ./test/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-fork
          path: test/artifacts/
          if-no-files-found: warn

  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check module and run upstream fallback E2E
        env:
          SUB2API_IMAGE: weishaw/sub2api:latest
        run: |
          node --check index.mjs
          ./test/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-fallback
          path: test/artifacts/
          if-no-files-found: warn
